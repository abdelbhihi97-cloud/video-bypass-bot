<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تخطي حقوق الفيديوهات</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding-top: 50px; }
        .box { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .file-input { margin: 20px 0; padding: 20px; border: 2px dashed #38bdf8; border-radius: 5px; cursor: pointer; display: block; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        .loading { display: none; margin-top: 15px; color: #fbbf24; }
    </style>
</head>
<body>

<div class="box">
    <h2>تعديل الفيديو لتجنب الحظر والحقوق 🚀</h2>
    <p>ارفع الفيديو الآن وسيتكفل السيرفر بتغيير بصمته بالكامل وإعادة تحميله لك تلقائياً.</p>
    
    <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
        <label class="file-input">
            <span>اضغط هنا لاختيار مقطع الفيديو 🎥</span>
            <input type="file" name="video_file" accept="video/*" required style="display:none;">
        </label>
        <button type="submit" class="btn">تعديل الفيديو وتنزيله فوراً</button>
    </form>
    
    <div class="loading" id="loadStatus">جاري معالجة وتعديل الفيديو.. قد يستغرق ذلك دقيقة حسب حجم الفيديو ⏳</div>
</div>

<script>
    function showLoading() {
        document.getElementById('loadStatus').style.display = 'block';
    }
</script>

</body>
</html>
